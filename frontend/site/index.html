<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blog de Gatitos</title>
    <meta name="description" content="Un blog adorable sobre gatos">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="min-h-screen bg-gradient-to-b from-pink-100 via-rose-50 to-purple-100 flex items-center justify-center p-4">
    <main class="w-full max-w-3xl">
        <div id="loading" class="text-center p-8">
            <div class="inline-block">
                <div class="animate-bounce text-6xl mb-4">🐱</div>
                <p class="text-purple-600 font-medium">Cargando información gatuna...</p>
            </div>
        </div>
        
        <article id="blog-content" class="hidden">
            <div class="bg-white/80 backdrop-blur-sm rounded-3xl shadow-2xl overflow-hidden border-2 border-pink-200">
                <div class="bg-gradient-to-r from-pink-300 to-purple-300 p-6 text-center">
                    <div class="text-5xl mb-2">🐱</div>
                    <h1 id="blog-title" class="text-3xl md:text-4xl font-bold text-white drop-shadow-lg"></h1>
                    <div class="flex justify-center gap-2 mt-2">
                        <span class="text-white/90 text-sm">Blog de gatos</span>
                    </div>
                </div>
                <div id="blog-content-md" class="p-6 md:p-8 prose prose-pink max-w-none"></div>
                <div class="bg-pink-50 p-4 text-center text-sm text-pink-500 border-t border-pink-100">
                    Hecho con amor para los amantes de los Gatitos <3
                </div>
            </div>
        </article>
    </main>
    <script src="scripts.js"></script>
</body>

</html>
