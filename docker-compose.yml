services:
  backend:
    build: ./backend
    image: backend:latest
    container_name: back
    ports:
      - "5000:5000"
    networks:
      - red-gatos

  frontend:
    build: ./frontend
    image: website:latest
    container_name: web
    ports:
      - "8080:80"
    networks:
      - red-gatos
    depends_on:
      - backend

networks:
  red-gatos:
    driver: bridge